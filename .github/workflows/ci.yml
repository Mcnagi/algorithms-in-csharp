name: CI

on:
  push:
    branches: [practice]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # let the other OS finish if one fails, so you see both results
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash               # Windows defaults to PowerShell; see the gotcha below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore --locked-mode   # fails if a lock file is out of date

      # Build, Test, Restore tools: unchanged

      - name: Generate coverage report
        if: always() && runner.os == 'Linux'
        # ...unchanged

      - name: Add coverage to job summary
        if: always() && runner.os == 'Linux'
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"